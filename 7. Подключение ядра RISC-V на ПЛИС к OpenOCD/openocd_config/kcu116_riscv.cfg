# xilinx ultrascale
# http://www.xilinx.com/support/documentation/user_guides/ug570-ultrascale-configuration.pdf

source [find interface/ftdi/digilent_jtag_smt2_nc.cfg]

transport select jtag
adapter speed 6000
set CHIP XCKU5P
source [find cpld/xilinx-xcu.cfg]

#source [find cpld/jtagspi.cfg]

set _CHIPNAME ot

#jtag newtap $_CHIPNAME cpu -irlen 5 -expected-id 0x10001cdf
set _TARGETNAME cpu
set TAP_NAME xcu.tap
target create $_TARGETNAME.0 riscv -chain-position $TAP_NAME
#tap_select xilinx_bscan
# 0 - nested TAP
riscv use_bscan_tunnel 5 0
init




